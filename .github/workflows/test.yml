name: Run Tests
on:
  push:
    branches:
      - 'main'
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm run test

  ruby:
    runs-on: ubuntu-latest
    name: ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.4'
    defaults:
      run:
        working-directory: gem

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".tool-versions"
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm ci
        working-directory: entrypoint
      - name: Install gems
        run: bundle install
      - name: Run the default task
        run: bundle exec rake
      - name: Build all gems
        run: bundle exec rake package

  python:
    runs-on: ubuntu-latest
    name: python ${{ matrix.python }}
    strategy:
      matrix:
        python:
          - '3.12'
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".tool-versions"
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm ci
        working-directory: entrypoint
      - name: Install dependencies
        run: uv sync
      - name: Bundle the entrypoints
        run: uv run python tasks.py entrypoints
      - name: Run the tests
        run: uv run pytest
      - name: Build all wheels
        run: uv run python tasks.py wheels
